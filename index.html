<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flat Wage Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EDE0;
    --card:#FBF7EE;
    --charcoal:#2A2926;
    --charcoal-2:#3A3834;
    --line:#E2D7C4;
    --muted:#7B7467;
    --amber:#D9831F;
    --amber-soft:#F6E2C2;
    --green:#4F7A3F;
    --green-soft:#DDEBD3;
    --red:#B8432C;
    --red-soft:#F3D9D1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--cream);
    color:var(--charcoal);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:15px;
    line-height:1.4;
    padding-bottom:70px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 16px;}

  /* top bar */
  .topbar{background:var(--charcoal);color:var(--cream);}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:12px;}
  .logo-mark{width:38px;height:38px;background:var(--amber);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--charcoal);font-weight:800;font-size:20px;}
  .logo-name{font-weight:800;font-size:24px;letter-spacing:-0.5px;}
  .logo-sub{font-size:12px;color:#B5AC9B;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}
  .save-status{font-size:12px;color:#B5AC9B;font-weight:500;}
  .save-status.ok{color:#A8CF94;}
  .save-status.error{color:#F0A08C;}

  /* period bar */
  .period{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 16px;flex-wrap:wrap;}
  .period-label{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;}
  .period-range{font-size:22px;font-weight:800;letter-spacing:-0.4px;}
  .period-nav{display:flex;gap:8px;}

  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-weight:700;font-size:14px;transition:opacity .15s, transform .1s;}
  button:active{transform:scale(0.97);}
  .btn{padding:11px 16px;}
  .btn-dark{background:var(--charcoal);color:var(--cream);}
  .btn-amber{background:var(--amber);color:var(--charcoal);}
  .btn-line{background:transparent;color:var(--charcoal);border:2px solid var(--line);}
  .btn-line:hover{border-color:var(--charcoal);}
  .btn-sm{padding:8px 12px;font-size:13px;}

  /* rules */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
  .rule{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;}
  .rule-k{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;}
  .rule-v{font-size:20px;font-weight:800;margin-top:2px;}
  .rule-v small{font-size:12px;font-weight:600;color:var(--muted);}
  .rule input{width:90px;font-family:inherit;font-size:20px;font-weight:800;background:transparent;border:none;border-bottom:2px solid var(--amber);color:var(--charcoal);padding:0 0 1px;}
  .rule input:focus{outline:none;background:var(--amber-soft);}

  /* tabs */
  .tabs{display:flex;gap:6px;background:var(--line);padding:5px;border-radius:12px;margin-bottom:18px;}
  .tab{flex:1;padding:12px 8px;background:transparent;color:var(--muted);border-radius:8px;font-size:14px;}
  .tab.active{background:var(--charcoal);color:var(--cream);}

  /* day card */
  .day{background:var(--card);border:2px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden;}
  .day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--charcoal);color:var(--cream);}
  .day-title{font-size:18px;font-weight:800;letter-spacing:-0.3px;}
  .day-meta{font-size:12px;color:#B5AC9B;font-weight:500;margin-top:1px;}
  .badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;}
  .badge.ok{background:var(--green-soft);color:var(--green);}
  .badge.low{background:var(--amber-soft);color:#8A5207;}
  .day-body{padding:6px 16px 16px;}

  /* table rows */
  .thead,.row{display:grid;grid-template-columns:1.7fr 1.25fr 1.25fr .8fr .95fr 40px;gap:10px;align-items:center;}
  .thead{padding:10px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--line);}
  .row{padding:10px 0;border-bottom:1px solid var(--line);}
  .row:last-of-type{border-bottom:none;}
  .cell label{display:none;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .name-in{width:100%;font-family:inherit;font-size:15px;font-weight:600;color:var(--charcoal);background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px 10px;min-height:44px;}
  .name-in:focus,.tsel:focus{outline:none;border-color:var(--amber);}
  .time{display:flex;align-items:center;gap:4px;}
  .tsel{flex:1;min-width:0;font-family:inherit;font-size:14px;font-weight:600;color:var(--charcoal);background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px 2px;min-height:44px;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;}
  .tsel.hr{flex:1.5;}
  .colon{color:var(--muted);font-weight:700;}
  .num{font-weight:700;font-variant-numeric:tabular-nums;}
  .num.dim{color:var(--muted);font-weight:500;}
  .pay{color:var(--green);}
  .cut{display:block;font-size:11px;color:var(--red);font-weight:600;margin-top:1px;}
  .del{width:40px;height:40px;background:transparent;color:var(--muted);font-size:16px;border:2px solid var(--line);}
  .del:hover{color:var(--red);border-color:var(--red);}
  .empty{padding:14px 0 6px;color:var(--muted);font-size:13px;font-style:italic;}
  .add{width:100%;margin-top:8px;padding:12px;background:transparent;color:var(--amber);border:2px dashed var(--amber);}
  .add:hover{background:var(--amber-soft);}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat{background:var(--charcoal);color:var(--cream);border-radius:12px;padding:16px;}
  .stat.amber{background:var(--amber);color:var(--charcoal);}
  .stat-k{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;opacity:.75;}
  .stat-v{font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .stat-v small{font-size:13px;font-weight:700;opacity:.8;}

  /* summary table */
  .tbl-wrap{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow-x:auto;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;min-width:520px;}
  th{background:var(--charcoal);color:var(--cream);text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:700;padding:12px 12px;white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  td{text-align:right;padding:13px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:500;}
  td:first-child{font-weight:700;}
  tr:last-child td{border-bottom:none;}
  td.total{font-weight:800;color:var(--green);}
  td small{display:block;color:var(--muted);font-size:11px;font-weight:500;}
  tfoot td{background:var(--amber-soft);font-weight:800;border-top:2px solid var(--amber);}
  .no-data{padding:26px 16px;text-align:center;color:var(--muted);}

  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .actions .btn{flex:1 1 160px;}

  .foot-note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6;}

  /* mobile */
  @media (max-width:640px){
    body{font-size:15px;}
    .wrap{padding:0 12px;}
    .period-range{font-size:19px;}
    .stat-v{font-size:21px;}
    .thead{display:none;}
    .row{grid-template-columns:1fr 1fr;gap:10px 8px;padding:14px 0;}
    .cell label{display:block;}
    .c-name{grid-column:1 / -1;}
    .c-hrs,.c-pay{grid-column:auto;}
    .c-hrs,.c-pay{background:var(--cream);border-radius:8px;padding:8px 10px;}
    .c-del{grid-column:1 / -1;}
    .del{width:100%;height:38px;font-size:13px;}
    .del::after{content:" Remove";}
    .tabs .tab{font-size:13px;padding:11px 4px;}
  }

  @media print{
    body{background:#fff;}
    .topbar,.tabs,.period-nav,.actions,.add,.del{display:none !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="logo">
      <div class="logo-mark">F</div>
      <div>
        <div class="logo-name">Flat</div>
        <div class="logo-sub">Wage Board</div>
      </div>
    </div>
    <div id="saveStatus" class="save-status"></div>
  </div>
</div>

<div class="wrap" id="app"></div>
<datalist id="namesList"></datalist>

<script>
const STORAGE_KEY = 'flat-wage-board-v3';
const HOURLY_RATE = 1;            // fixed: 1 OMR per hour
const HOUR_OPTIONS = [16,17,18,19,20,21,22,23,0,1,2,3];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dShort = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
function lastSunday(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate() - t.getDay()); }

/* ---------- state ---------- */
let state = { start: iso(lastSunday()), periods: {} };
let view = 'w1'; // w1 | w2 | sum

function emptyPeriod(){
  const entries = {};
  for(let i=0;i<14;i++) entries[i] = [];
  return { entries, nextId: 1 };
}
function period(){
  if(!state.periods[state.start]) state.periods[state.start] = emptyPeriod();
  return state.periods[state.start];
}

/* ---------- schedule ---------- */
function sched(dow){
  if(dow <= 3) return { time:'6 PM – 11 PM', hrs:5, min:4, label:'4 staff' };
  if(dow <= 5) return { time:'6 PM – 1 AM',  hrs:7, min:6, label:'6 staff' };
  return            { time:'6 PM – 1 AM',  hrs:7, min:4, label:'4–5 staff' };
}

/* ---------- pay maths ---------- */
function calcEntry(e){
  const none = { hours:0, pay:0, worked:false };
  if(!e || e.in.h==='' || e.in.m==='' || e.out.h==='' || e.out.m==='') return none;
  const clockIn = Number(e.in.h)*60 + Number(e.in.m);
  let end = Number(e.out.h)*60 + Number(e.out.m);
  if(end <= clockIn) end += 24*60;               // shift crosses midnight
  let hours = Math.round(((end - clockIn) / 60) * 2) / 2;    // nearest half hour
  if(hours <= 0) return none;
  return { hours, pay: hours * HOURLY_RATE, worked:true };
}
const fmt = n => n.toFixed(3);
const fmtH = h => (h % 1 === 0) ? String(h) : h.toFixed(1);
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const hourLabel = h24 => { const p = h24 < 12 ? 'AM' : 'PM'; let h = h24 % 12; if(h===0) h = 12; return `${h} ${p}`; };

function computeTotals(){
  const p = period();
  const map = {};
  for(let i=0;i<14;i++){
    p.entries[i].forEach(e => {
      const name = (e.name||'').trim();
      if(!name) return;
      const r = calcEntry(e);
      if(!r.worked) return;
      const key = name.toLowerCase();
      if(!map[key]) map[key] = { name, weeks:[{h:0,pay:0,days:0},{h:0,pay:0,days:0}], dayLines:[[],[]] };
      const w = i < 7 ? 0 : 1;
      map[key].weeks[w].h += r.hours;
      map[key].weeks[w].pay += r.pay;
      map[key].weeks[w].days += 1;
      map[key].dayLines[w].push(`${DOW3[addDays(parseISO(state.start), i).getDay()]} ${fmtH(r.hours)}h`);
    });
  }
  const list = Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
  list.forEach(t => {
    t.hours = t.weeks[0].h + t.weeks[1].h;
    t.days = t.weeks[0].days + t.weeks[1].days;
    t.pay = t.weeks[0].pay + t.weeks[1].pay;
  });
  return list;
}

/* ---------- storage ---------- */
async function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
  if(!raw){
    try{
      if(window.storage){
        const r = await window.storage.get(STORAGE_KEY, false);
        if(r && r.value) raw = r.value;
      }
    }catch(e){}
  }
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      state.start = parsed.start || state.start;
      state.periods = parsed.periods || {};
    }catch(e){}
  }
  render();
}
async function saveState(){
  const el = document.getElementById('saveStatus');
  const payload = JSON.stringify(state);
  let ok = false;
  try{ localStorage.setItem(STORAGE_KEY, payload); ok = true; }catch(e){}
  try{ if(window.storage){ await window.storage.set(STORAGE_KEY, payload, false); ok = true; } }catch(e){}
  if(el){
    el.textContent = ok ? 'Saved' : 'Not saved on this device';
    el.className = 'save-status ' + (ok ? 'ok' : 'error');
  }
}

/* ---------- actions ---------- */
function addEntry(i){
  const p = period();
  p.entries[i].push({ id:p.nextId++, name:'', in:{h:'',m:''}, out:{h:'',m:''} });
  saveState(); render();
}
function removeEntry(i,id){
  const p = period();
  p.entries[i] = p.entries[i].filter(e => e.id !== id);
  saveState(); render();
}
function updateEntry(i,id,field,value){
  const e = period().entries[i].find(x => x.id === id);
  if(!e) return;
  if(field === 'name') e.name = value;
  else { const [which, part] = field.split('-'); e[which][part] = value; }
  saveState(); render();
}
function shiftPeriod(days){
  state.start = iso(addDays(parseISO(state.start), days));
  view = 'w1';
  saveState(); render();
}
function resetPeriod(){
  if(!confirm('Clear everything entered in this 2-week period?')) return;
  state.periods[state.start] = emptyPeriod();
  saveState(); render();
}

/* ---------- render ---------- */
function timeSel(i,id,which,val){
  const vh = val.h, vm = val.m;
  let h = `<option value="">--</option>`;
  HOUR_OPTIONS.forEach(x => { const s = pad(x); h += `<option value="${s}" ${vh===s?'selected':''}>${hourLabel(x)}</option>`; });
  let m = `<option value="">--</option>`;
  for(let x=0;x<60;x+=5){ const s = pad(x); m += `<option value="${s}" ${vm===s?'selected':''}>${s}</option>`; }
  return `<div class="time">
    <select class="tsel hr" data-d="${i}" data-id="${id}" data-f="${which}-h" aria-label="${which} hour">${h}</select>
    <span class="colon">:</span>
    <select class="tsel" data-d="${i}" data-id="${id}" data-f="${which}-m" aria-label="${which} minutes">${m}</select>
  </div>`;
}

function dayCard(i){
  const date = addDays(parseISO(state.start), i);
  const s = sched(date.getDay());
  const list = period().entries[i];
  let rows = '';
  if(list.length === 0) rows = `<div class="empty">Nobody added yet.</div>`;
  list.forEach(e => {
    const r = calcEntry(e);
    rows += `<div class="row">
      <div class="cell c-name"><label>Name</label>
        <input class="name-in" type="text" list="namesList" placeholder="Waiter name" value="${esc(e.name)}" data-d="${i}" data-id="${e.id}" data-f="name" autocomplete="off"></div>
      <div class="cell c-in"><label>In</label>${timeSel(i,e.id,'in',e.in)}</div>
      <div class="cell c-out"><label>Out</label>${timeSel(i,e.id,'out',e.out)}</div>
      <div class="cell c-hrs"><label>Hours</label>
        <span class="num ${r.worked?'':'dim'}">${r.worked ? fmtH(r.hours)+'h' : '—'}</span></div>
      <div class="cell c-pay"><label>Pay</label>
        <span class="num ${r.worked?'pay':'dim'}">${r.worked ? fmt(r.pay) : '—'}</span></div>
      <div class="cell c-del"><button class="del" data-act="del" data-d="${i}" data-id="${e.id}" aria-label="Remove">✕</button></div>
    </div>`;
  });
  return `<section class="day">
    <div class="day-head">
      <div>
        <div class="day-title">${DOW[date.getDay()]} · ${dShort(date)}</div>
        <div class="day-meta">${s.time} · ${s.hrs}h shift</div>
      </div>
    </div>
    <div class="day-body">
      <div class="thead"><div>Name</div><div>In</div><div>Out</div><div>Hours</div><div>Pay (OMR)</div><div></div></div>
      ${rows}
      <button class="add" data-act="add" data-d="${i}">+ Add person</button>
    </div>
  </section>`;
}

function summaryView(){
  const list = computeTotals();
  const grandPay = list.reduce((a,t)=>a+t.pay,0);
  const grandH = list.reduce((a,t)=>a+t.hours,0);
  let body = '';
  list.forEach(t => {
    body += `<tr>
      <td>${esc(t.name)}</td>
      <td>${t.days}</td>
      <td>${fmtH(t.hours)}h</td>
      <td>${fmt(t.weeks[0].pay)}<small>${fmtH(t.weeks[0].h)}h</small></td>
      <td>${fmt(t.weeks[1].pay)}<small>${fmtH(t.weeks[1].h)}h</small></td>
      <td class="total">${fmt(t.pay)}</td>
    </tr>`;
  });
  const w1 = list.reduce((a,t)=>a+t.weeks[0].pay,0);
  const w2 = list.reduce((a,t)=>a+t.weeks[1].pay,0);
  const table = list.length === 0
    ? `<div class="no-data">No completed shifts yet. Add people and their In / Out times in Week 1 or Week 2.</div>`
    : `<table>
        <thead><tr><th>Waiter</th><th>Days</th><th>Hours</th><th>Week 1</th><th>Week 2</th><th>Total (OMR)</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>All staff</td><td>${list.reduce((a,t)=>a+t.days,0)}</td><td>${fmtH(grandH)}h</td><td>${fmt(w1)}</td><td>${fmt(w2)}</td><td>${fmt(grandPay)}</td></tr></tfoot>
      </table>`;
  return `
    <div class="stats">
      <div class="stat amber"><div class="stat-k">Total payout</div><div class="stat-v">${fmt(grandPay)} <small>OMR</small></div></div>
      <div class="stat"><div class="stat-k">Total hours</div><div class="stat-v">${fmtH(grandH)}<small>h</small></div></div>
      <div class="stat"><div class="stat-k">Staff paid</div><div class="stat-v">${list.length}</div></div>
    </div>
    <div class="tbl-wrap">${table}</div>
    <div class="actions">
      <button class="btn btn-amber" id="copyBtn" data-act="copy">Copy for WhatsApp</button>
      <button class="btn btn-line" data-act="print">Print</button>
      <button class="btn btn-line" data-act="reset">Reset this period</button>
    </div>`;
}

function render(){
  const y = window.scrollY;
  const start = parseISO(state.start);
  const end = addDays(start, 13);
  const range = `${dShort(start)} – ${dShort(end)} ${end.getFullYear()}`;

  let content = '';
  if(view === 'w1') for(let i=0;i<7;i++) content += dayCard(i);
  else if(view === 'w2') for(let i=7;i<14;i++) content += dayCard(i);
  else content = summaryView();

  document.getElementById('app').innerHTML = `
    <div class="period">
      <div>
        <div class="period-label">2-week pay period</div>
        <div class="period-range">${range}</div>
      </div>
      <div class="period-nav">
        <button class="btn btn-line btn-sm" data-act="prev">‹ Previous</button>
        <button class="btn btn-line btn-sm" data-act="next">Next ›</button>
      </div>
    </div>

    <div class="rules">
      <div class="rule"><div class="rule-k">Hourly rate</div><div class="rule-v">1.000 <small>OMR / hour</small></div></div>
    </div>

    <div class="tabs">
      <button class="tab ${view==='w1'?'active':''}" data-act="tab" data-v="w1">Week 1</button>
      <button class="tab ${view==='w2'?'active':''}" data-act="tab" data-v="w2">Week 2</button>
      <button class="tab ${view==='sum'?'active':''}" data-act="tab" data-v="sum">Summary</button>
    </div>

    ${content}

    <p class="foot-note">Pay is 1 OMR per hour worked, counted from the In time to the Out time to the nearest half hour. Overtime is paid at the same rate.</p>
  `;

  // name suggestions
  const names = new Set();
  Object.values(state.periods).forEach(p => {
    for(let i=0;i<14;i++) (p.entries[i]||[]).forEach(e => { if((e.name||'').trim()) names.add(e.name.trim()); });
  });
  document.getElementById('namesList').innerHTML = [...names].map(n => `<option value="${esc(n)}">`).join('');
  window.scrollTo(0, y);
}

/* ---------- WhatsApp text ---------- */
function buildText(){
  const start = parseISO(state.start), end = addDays(start, 13);
  const list = computeTotals();
  const L = [];
  L.push('*FLAT — Wage Board*');
  L.push(`${dShort(start)} – ${dShort(end)} ${end.getFullYear()}`);
  L.push('');
  let gp = 0, gh = 0;
  list.forEach(t => {
    gp += t.pay; gh += t.hours;
    L.push(`*${t.name}*`);
    [0,1].forEach(w => {
      if(t.weeks[w].days) L.push(`Week ${w+1}: ${t.dayLines[w].join(', ')} = ${fmtH(t.weeks[w].h)}h → ${fmt(t.weeks[w].pay)}`);
    });
    L.push(`Total: ${fmtH(t.hours)}h, ${t.days} days → *${fmt(t.pay)} OMR*`);
    L.push('');
  });
  L.push('------------------------');
  L.push(`*TOTAL: ${fmtH(gh)}h → ${fmt(gp)} OMR*`);
  return L.join('\n');
}
async function copyText(){
  const text = buildText();
  const btn = document.getElementById('copyBtn');
  const done = () => { if(btn){ const o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(()=>{ btn.textContent = o; }, 1800); } };
  try{ await navigator.clipboard.writeText(text); done(); return; }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ alert('Could not copy automatically.'); }
  document.body.removeChild(ta);
}

/* ---------- events (delegated) ---------- */
const app = document.getElementById('app');
app.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.f){
    updateEntry(Number(t.dataset.d), Number(t.dataset.id), t.dataset.f, t.value);
  }
});
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  if(act === 'add') addEntry(Number(b.dataset.d));
  else if(act === 'del') removeEntry(Number(b.dataset.d), Number(b.dataset.id));
  else if(act === 'tab'){ view = b.dataset.v; render(); window.scrollTo(0,0); }
  else if(act === 'prev') shiftPeriod(-14);
  else if(act === 'next') shiftPeriod(14);
  else if(act === 'copy') copyText();
  else if(act === 'print') window.print();
  else if(act === 'reset') resetPeriod();
});

loadState();
</script>
